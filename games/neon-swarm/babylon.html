<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06041a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Neon Swarm</title>
<style>
:root{
  --void:#06041a; --ice:#9ff6ff; --mag:#ff2fd2; --vio:#7a5cff; --amb:#ffb12e; --lime:#c6ff3d;
  --ink:#ece9ff; --dim:rgba(236,233,255,.58);
  --font:"Avenir Next Condensed","Bahnschrift","DIN Condensed","sans-serif-condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sr:env(safe-area-inset-right,0px);
  --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--void);
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;font-family:var(--font);font-stretch:condensed;color:var(--ink)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

/* HUD */
.hud{position:absolute;inset:0;pointer-events:none;
  padding:calc(var(--st) + 14px) calc(var(--sr) + 18px) calc(var(--sb) + 12px) calc(var(--sl) + 18px)}
.lvl{position:absolute;left:calc(var(--sl) + 18px);right:calc(var(--sr) + 18px);top:calc(var(--st) + 6px);height:2px;
  background:rgba(122,92,255,.18);border-radius:2px;overflow:hidden;opacity:0;transition:opacity .3s}
.lvl i{display:block;height:100%;width:0;background:var(--vio);box-shadow:0 0 8px var(--vio)}
.lvl.flash i{background:#fff;box-shadow:0 0 14px #fff}
.stat{position:absolute;top:calc(var(--st) + 16px);display:flex;flex-direction:column;gap:0;opacity:0;transition:opacity .25s}
.stat.l{left:calc(var(--sl) + 18px)} .stat.r{right:calc(var(--sr) + 18px);align-items:flex-end}
.stat span{font-size:13px;letter-spacing:.06em;color:var(--dim)}
.stat b{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(159,246,255,.55)}
.stat.r b{font-size:20px;color:var(--dim);text-shadow:none}
.combo{position:absolute;left:50%;top:calc(var(--st) + 22px);transform:translateX(-50%);font-size:28px;font-weight:800;
  color:#fff;white-space:nowrap;opacity:0;transition:opacity .35s;font-variant-numeric:tabular-nums;
  text-shadow:0 0 6px var(--mag),0 0 18px var(--mag),0 0 36px var(--vio)}
.combo.on{opacity:1;transition:opacity .05s}
.combo.bump{animation:bump .18s ease-out}
@keyframes bump{0%{transform:translateX(-50%) scale(1.35)}100%{transform:translateX(-50%) scale(1)}}
.perf{position:absolute;left:calc(var(--sl) + 14px);bottom:calc(var(--sb) + 10px);font-size:12px;line-height:1.35;
  color:var(--dim);font-family:system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:pre}
.playing .stat,.playing .lvl{opacity:1}
#pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;left:0;top:0;white-space:nowrap;font-weight:800;font-size:22px;opacity:0;
  transform:translate(-50%,-50%);text-shadow:0 0 6px currentColor,0 0 16px currentColor}
.pop.on{animation:pop .95s ease-out forwards}
.pop.big{font-size:34px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}
  14%{opacity:1;transform:translate(-50%,-60%) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}

/* Overlay */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:calc(var(--st) + 24px) calc(var(--sr) + 24px) calc(var(--sb) + 24px) calc(var(--sl) + 24px);
  background:radial-gradient(ellipse at center,rgba(6,4,26,.25),rgba(6,4,26,.72));transition:opacity .2s}
.ov.hide{opacity:0;pointer-events:none}
.panel{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:34ch}
.panel[hidden]{display:none}
.logo{margin:0 0 6px;font-size:clamp(64px,19vmin,168px);line-height:.84;font-weight:800;letter-spacing:.03em;
  text-transform:uppercase;color:#fff;
  text-shadow:0 0 4px #fff,0 0 14px var(--mag),0 0 34px var(--mag),0 0 74px var(--vio);
  animation:flicker 1.4s steps(1,end) 1}
@keyframes flicker{0%{opacity:.08}8%{opacity:1}12%{opacity:.25}18%{opacity:1}40%{opacity:.6}44%{opacity:1}100%{opacity:1}}
h2{margin:0;font-size:44px;font-weight:800;color:#fff;text-shadow:0 0 6px var(--mag),0 0 22px var(--mag)}
.big{font-size:clamp(56px,14vmin,96px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 0 10px var(--ice),0 0 30px rgba(159,246,255,.5)}
.tap{margin:4px 0 0;font-size:24px;font-weight:700;color:var(--ice);text-shadow:0 0 10px var(--ice);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.sub{margin:0;font-size:18px;color:var(--dim);font-variant-numeric:tabular-nums}
.small{margin:0;font-size:13px;color:var(--dim);font-family:system-ui,sans-serif;line-height:1.4}
.btn{margin-top:14px;font:inherit;font-size:18px;font-weight:700;letter-spacing:.04em;color:var(--amb);background:transparent;
  border:1.5px solid var(--amb);border-radius:999px;padding:11px 26px;cursor:pointer;
  box-shadow:0 0 14px rgba(255,177,46,.35),inset 0 0 10px rgba(255,177,46,.2);text-shadow:0 0 8px rgba(255,177,46,.7)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:4px}
@media (prefers-reduced-motion:reduce){.logo,.tap{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pops"></div>
<div class="hud" id="hud">
  <div class="lvl" id="lvl"><i id="lvlFill"></i></div>
  <div class="stat l"><span>Score</span><b id="score">0</b></div>
  <div class="stat r"><span>Best</span><b id="best">0</b></div>
  <div class="combo" id="combo"></div>
  <div class="perf" id="perf">-- fps</div>
</div>
<div class="ov" id="ov">
  <div class="panel" id="pTitle">
    <h1 class="logo">Neon<br>Swarm</h1>
    <p class="tap" id="tapMsg">Loading</p>
    <p class="sub" id="tBest"></p>
    <button class="btn" id="stressBtn" type="button" hidden>Stress test</button>
  </div>
  <div class="panel" id="pOver" hidden>
    <h2>Game over</h2>
    <div class="big" id="oScore">0</div>
    <p class="sub" id="oBest"></p>
    <p class="tap">Tap to play again</p>
  </div>
  <div class="panel" id="pStress" hidden>
    <h2>Stress test</h2>
    <div class="big" id="sPeak">0</div>
    <p class="sub">objects at peak</p>
    <p class="small" id="sDetail"></p>
    <p class="tap">Tap to continue</p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.33.1/babylon.js" onerror="window.__bjsFail=1"></script>
<script>
(function () {
'use strict';
const $ = (id) => document.getElementById(id);
const canvas = $('c');
const fail = (msg) => { $('tapMsg').textContent = msg; $('tapMsg').style.animation = 'none'; };
if (!window.BABYLON || window.__bjsFail) { fail("Couldn't load Babylon.js 9.33.1. Check the connection and reload."); return; }
const B = BABYLON, V3 = B.Vector3, C3 = B.Color3;

// ---------- Engine / scene ----------
let engine;
try {
  engine = new B.Engine(canvas, true, { stencil: true, powerPreference: 'high-performance', preserveDrawingBuffer: false }, false);
} catch (e) { fail("WebGL isn't available on this device."); return; }
const DPR = Math.min(window.devicePixelRatio || 1, 2);
engine.setHardwareScalingLevel(1 / DPR);

const scene = new B.Scene(engine);
scene.clearColor = new B.Color4(6 / 255, 4 / 255, 26 / 255, 1);
scene.fogMode = B.Scene.FOGMODE_EXP2; scene.fogDensity = 0.011; scene.fogColor = C3.FromHexString('#06041a');
scene.skipPointerMovePicking = true; scene.skipPointerDownPicking = true; scene.skipPointerUpPicking = true;
scene.skipFrustumClipping = true;

const cam = new B.ArcRotateCamera('cam', -Math.PI / 2, 0.44, 31, V3.Zero(), scene);
cam.fov = 0.62; cam.minZ = 1; cam.maxZ = 220;

const hemi = new B.HemisphericLight('hemi', new V3(0, 1, 0), scene);
hemi.intensity = 0.22; hemi.diffuse = new C3(0.45, 0.4, 0.95); hemi.groundColor = C3.Black(); hemi.specular = C3.Black();

const COLS = ['#ff2fd2', '#7a5cff', '#ffb12e', '#9ff6ff', '#c6ff3d']; // magenta, violet, amber, ice, lime
const COL3 = COLS.map((h) => C3.FromHexString(h));
const MAXL = 6;

function litMat(name, col, emis, diff) {
  const m = new B.StandardMaterial(name, scene);
  m.diffuseColor = col.scale(diff); m.emissiveColor = col.scale(emis);
  m.specularColor = new C3(0.9, 0.9, 0.95); m.specularPower = 48; m.maxSimultaneousLights = MAXL;
  return m;
}
function unlitMat(name, col, k) {
  const m = new B.StandardMaterial(name, scene);
  m.disableLighting = true; m.emissiveColor = col.scale(k); m.diffuseColor = C3.Black(); m.specularColor = C3.Black();
  return m;
}

// ---------- Ground: procedural neon grid ----------
const ground = B.MeshBuilder.CreateGround('ground', { width: 400, height: 400 }, scene);
ground.isPickable = false;
const gridTex = new B.DynamicTexture('grid', 256, scene, true);
{
  const g = gridTex.getContext();
  g.fillStyle = '#000'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = '#3a2aa6'; g.lineWidth = 5; g.strokeRect(0, 0, 256, 256);
  g.fillStyle = '#6a55ff';
  [[0, 0], [256, 0], [0, 256], [256, 256]].forEach(([x, y]) => g.fillRect(x - 6, y - 6, 12, 12));
  gridTex.update();
}
gridTex.wrapU = gridTex.wrapV = B.Texture.WRAP_ADDRESSMODE; gridTex.uScale = gridTex.vScale = 160; gridTex.anisotropicFilteringLevel = 8;
const gMat = new B.StandardMaterial('gmat', scene);
gMat.diffuseColor = new C3(0.05, 0.045, 0.11); gMat.specularColor = new C3(0.55, 0.5, 0.95); gMat.specularPower = 22;
gMat.emissiveTexture = gridTex; gMat.emissiveTexture.level = 0.55; gMat.maxSimultaneousLights = MAXL;
ground.material = gMat;

// ---------- Glow & post-processing (built-in) ----------
const glow = new B.GlowLayer('glow', scene, { mainTextureRatio: 0.5, blurKernelSize: 26 });
glow.intensity = 0.9; glow.addExcludedMesh(ground);
// Saturated halo colour per mesh, independent of the lit surface colour (keeps cores crisp and halos pure)
glow.customEmissiveColorSelector = (mesh, subMesh, material, result) => {
  const g = mesh.metadata && mesh.metadata.glow;
  if (g) result.set(g.r * 0.8, g.g * 0.8, g.b * 0.8, 1);
  else { const e = material.emissiveColor || C3.Black(); result.set(e.r, e.g, e.b, 1); }
};

const pipe = new B.DefaultRenderingPipeline('pp', true, scene, [cam]);
pipe.samples = engine.webGLVersion > 1 ? 4 : 1;
pipe.bloomEnabled = true; pipe.bloomThreshold = 0.6; pipe.bloomWeight = 0.42; pipe.bloomKernel = 40; pipe.bloomScale = 0.5;
pipe.imageProcessingEnabled = true;
pipe.imageProcessing.contrast = 1.25; pipe.imageProcessing.exposure = 1.05;
pipe.imageProcessing.vignetteEnabled = true; pipe.imageProcessing.vignetteWeight = 2.6;
pipe.imageProcessing.vignetteColor = new B.Color4(0.02, 0, 0.08, 0);
pipe.chromaticAberrationEnabled = true; pipe.chromaticAberration.aberrationAmount = 0; pipe.chromaticAberration.radialIntensity = 1.2;
pipe.grainEnabled = true; pipe.grain.intensity = 6; pipe.grain.animated = true;

// ---------- Thin-instance pools (1 draw call per shape/color) ----------
class Pool {
  constructor(mesh, cap) {
    this.mesh = mesh; this.cap = cap; this.n = 0; this.buf = new Float32Array(cap * 16);
    mesh.thinInstanceSetBuffer('matrix', this.buf, 16, false);
    mesh.alwaysSelectAsActiveMesh = true; mesh.doNotSyncBoundingInfo = true; mesh.isPickable = false;
    mesh.thinInstanceCount = 0; mesh.isVisible = false;
  }
  grow() {
    const c = this.cap * 2, nb = new Float32Array(c * 16); nb.set(this.buf);
    this.buf = nb; this.cap = c; this.mesh.thinInstanceSetBuffer('matrix', nb, 16, false);
  }
  push(x, y, z, a, b, s) {
    if (this.n >= this.cap) this.grow();
    const o = this.n++ * 16, m = this.buf;
    const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b);
    m[o] = ca * s; m[o + 1] = 0; m[o + 2] = -sa * s; m[o + 3] = 0;
    m[o + 4] = sb * sa * s; m[o + 5] = cb * s; m[o + 6] = sb * ca * s; m[o + 7] = 0;
    m[o + 8] = cb * sa * s; m[o + 9] = -sb * s; m[o + 10] = cb * ca * s; m[o + 11] = 0;
    m[o + 12] = x; m[o + 13] = y; m[o + 14] = z; m[o + 15] = 1;
  }
  commit() {
    this.mesh.thinInstanceCount = this.n;
    if (this.n > 0) this.mesh.thinInstanceBufferUpdated('matrix');
    this.mesh.isVisible = this.n > 0;
  }
}

// Enemy types: dart (tetra), cube, octa
const ETYPES = [
  { r: 0.42, speed: 5.6, accel: 3.0, col: 0, mesh: B.MeshBuilder.CreatePolyhedron('dart', { type: 0, size: 0.52 }, scene) },
  { r: 0.5, speed: 4.3, accel: 2.4, col: 1, mesh: B.MeshBuilder.CreateBox('cube', { size: 0.8 }, scene) },
  { r: 0.6, speed: 3.4, accel: 1.8, col: 2, mesh: B.MeshBuilder.CreatePolyhedron('octa', { type: 1, size: 0.72 }, scene) },
];
const ePools = ETYPES.map((t, i) => { t.mesh.material = litMat('em' + i, COL3[t.col], 0.5, 0.5); t.mesh.material.specularColor.set(0.5, 0.5, 0.55);
  t.mesh.metadata = { glow: COL3[t.col] }; return new Pool(t.mesh, 256); });
const dPools = COL3.map((c, i) => {
  const m = B.MeshBuilder.CreatePolyhedron('deb' + i, { type: 0, size: 1 }, scene);
  m.material = litMat('dm' + i, c, 0.75, 0.3); m.metadata = { glow: c }; return new Pool(m, 512);
});

// ---------- Structure-of-arrays storage ----------
function soa(fields, cap) { const o = { cap, n: 0, fields }; for (const [k, T] of fields) o[k] = new T(cap); return o; }
function soaGrow(o) { const c = o.cap * 2; for (const [k, T] of o.fields) { const a = new T(c); a.set(o[k]); o[k] = a; } o.cap = c; }
function soaCopy(o, i, j) { for (const f of o.fields) o[f[0]][i] = o[f[0]][j]; }
const F = Float32Array, U = Uint8Array;
const E = soa([['x', F], ['z', F], ['vx', F], ['vz', F], ['a', F], ['b', F], ['sa', F], ['sb', F], ['bias', F], ['age', F],
  ['orb', F], ['ph', F], ['spd', F], ['type', U], ['near', U], ['dead', U]], 512);
const D = soa([['x', F], ['y', F], ['z', F], ['vx', F], ['vy', F], ['vz', F], ['a', F], ['b', F], ['sa', F], ['sb', F],
  ['life', F], ['max', F], ['size', F], ['col', U]], 2048);

// ---------- Spatial grid ----------
const GC = 2.5, GN = 96, GH = GN * GC / 2;
const head = new Int32Array(GN * GN);
let nxt = new Int32Array(E.cap);
const cellX = (x) => { const c = ((x + GH) / GC) | 0; return c < 0 ? 0 : c >= GN ? GN - 1 : c; };
function buildGrid() {
  head.fill(-1);
  if (nxt.length < E.cap) nxt = new Int32Array(E.cap);
  for (let i = 0; i < E.n; i++) {
    if (E.dead[i]) continue;
    const c = cellX(E.z[i]) * GN + cellX(E.x[i]); nxt[i] = head[c]; head[c] = i;
  }
}
function query(x, z, r, fn) {
  const x0 = cellX(x - r), x1 = cellX(x + r), z0 = cellX(z - r), z1 = cellX(z + r);
  for (let cz = z0; cz <= z1; cz++) for (let cx = x0; cx <= x1; cx++)
    for (let j = head[cz * GN + cx]; j >= 0; j = nxt[j]) fn(j);
}

// ---------- Player, trail, charge ring ----------
const player = B.MeshBuilder.CreateSphere('player', { diameter: 0.56, segments: 16 }, scene);
player.material = unlitMat('pm', new C3(0.85, 1, 1), 1.15); player.position.y = 0.5; player.isPickable = false;
const trail = new B.TrailMesh('trail', player, scene, { diameter: 0.22, length: 30, segments: 30, sections: 4, autoStart: true });
const trailMat = unlitMat('tm', COL3[3], 0.75); trailMat.alpha = 0.7; trail.material = trailMat; trail.isPickable = false;
const pLight = new B.PointLight('pl', new V3(0, 1.2, 0), scene);
pLight.diffuse = COL3[3]; pLight.specular = COL3[3].scale(0.6); pLight.intensity = 0.9; pLight.range = 7;

const ringNode = new B.TransformNode('ring', scene);
const dotOn = unlitMat('dOn', COL3[4], 1.3), dotOff = unlitMat('dOff', new C3(0.2, 0.22, 0.45), 0.6);
const dots = [];
for (let k = 0; k < 10; k++) {
  const d = B.MeshBuilder.CreateSphere('dot' + k, { diameter: 0.15, segments: 6 }, scene);
  const a = k / 10 * Math.PI * 2; d.position.set(Math.cos(a) * 0.86, 0, Math.sin(a) * 0.86);
  d.parent = ringNode; d.material = dotOff; d.isPickable = false; dots.push(d);
}

// ---------- Orbs ----------
const orbSrc = B.MeshBuilder.CreateSphere('orb', { diameter: 0.5, segments: 6 }, scene);
orbSrc.material = unlitMat('om', COL3[4], 1.05); orbSrc.isVisible = false; orbSrc.isPickable = false;
const orbs = [];
for (let k = 0; k < 8; k++) {
  const m = orbSrc.createInstance('o' + k); m.isPickable = false; m.setEnabled(false);
  orbs.push({ m, x: 0, z: 0, on: false, ph: Math.random() * 6, wait: 0 });
}

// ---------- FX pools: flashes, shock rings, explosion lights ----------
const flashes = [];
for (let k = 0; k < 12; k++) {
  const m = B.MeshBuilder.CreateSphere('fl' + k, { diameter: 1, segments: 10 }, scene);
  const mat = unlitMat('flm' + k, C3.White(), 1); mat.alpha = 0; m.material = mat; m.isPickable = false; m.setEnabled(false);
  flashes.push({ m, mat, t: 0, dur: 1, s: 1, col: C3.White(), on: false });
}
const rings = [];
for (let k = 0; k < 3; k++) {
  const m = B.MeshBuilder.CreateTorus('rg' + k, { diameter: 2, thickness: 0.028, tessellation: 96 }, scene);
  const mat = unlitMat('rgm' + k, COL3[3], 1.1); mat.alpha = 0; m.material = mat; m.isPickable = false; m.setEnabled(false);
  m.position.y = 0.35; rings.push({ m, mat });
}
let ringIdx = 0;
const lights = [];
for (let k = 0; k < 4; k++) {
  const l = new B.PointLight('xl' + k, new V3(0, 1.6, 0), scene);
  l.intensity = 0; l.range = 12; lights.push({ l, v: 0 });
}

// ---------- Audio (Web Audio API, all synthesized) ----------
const AU = { ctx: null, out: null, noise: null, lastBoom: 0, lastClose: 0 };
function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = new AC(), comp = ctx.createDynamicsCompressor(), g = ctx.createGain();
    comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.2;
    g.gain.value = 0.55; g.connect(comp); comp.connect(ctx.destination);
    const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    AU.ctx = ctx; AU.out = g; AU.noise = nb;
  } catch (e) { AU.ctx = null; }
}
const sound = () => AU.ctx && AU.ctx.state === 'running' && (state === 'play' || state === 'dead');
function env(g, t, peak, dur) {
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.006 + dur);
}
function tone(type, f0, f1, t, dur, vol) {
  const o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  env(g, t, vol, dur); o.connect(g); g.connect(AU.out); o.start(t); o.stop(t + dur + 0.05);
}
function noise(t, dur, vol, type, f0, f1, q) {
  const s = AU.ctx.createBufferSource(), f = AU.ctx.createBiquadFilter(), g = AU.ctx.createGain();
  s.buffer = AU.noise; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  env(g, t, vol, dur); s.connect(f); f.connect(g); g.connect(AU.out); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
function sfxBoom(combo) { // pitch climbs one semitone per combo step
  if (!sound()) return; const t = AU.ctx.currentTime; if (t - AU.lastBoom < 0.028) return; AU.lastBoom = t;
  const f = 110 * Math.pow(2, Math.min(combo - 1, 36) / 12);
  tone('triangle', f * 2.2, f * 0.55, t, 0.2, 0.3); tone('sine', f * 4.4, f * 2, t, 0.09, 0.11);
  noise(t, 0.22, 0.38, 'bandpass', f * 8, f * 2, 0.9);

const SCALE = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16];

    query(Q.x, Q.z, Q.r, (j) => { if (!E.dead[j] && Math.hypot(E.x[j] - Q.x, E.z[j] - Q.z) <= Q.r) kill(j, true); });
  }
}
function compactEnemies() {
  let n = E.n; for (let i = 0; i < n;) { if (E.dead[i]) { n--; if (i !== n) soaCopy(E, i, n); } else i++; } E.n = n;
}
function updateDebris(dt) {
  const drag = Math.max(0, 1 - 1.2 * dt);
  let n = D.n;
  for (let i = 0; i < n;) {
    D.life[i] -= dt;
    if (D.life[i] <= 0) { n--; if (i !== n) soaCopy(D, i, n); continue; }
    D.vy[i] -= 22 * dt; D.vx[i] *= drag; D.vz[i] *= drag;
    D.x[i] += D.vx[i] * dt; D.y[i] += D.vy[i] * dt; D.z[i] += D.vz[i] * dt;
    if (D.y[i] < 0.06) { D.y[i] = 0.06; D.vy[i] = -D.vy[i] * 0.42; D.vx[i] *= 0.75; D.vz[i] *= 0.75; D.sa[i] *= 0.7; D.sb[i] *= 0.7; }
    D.a[i] += D.sa[i] * dt; D.b[i] += D.sb[i] * dt;
    i++;
  }
  D.n = n;
}
function updateOrbs(dt) {
  const want = state === 'play' ? Math.min(7, 4 + (level >> 1)) : 0;
  for (let k = 0; k < orbs.length; k++) {
    const o = orbs[k];
    if (o.wait > 0) o.wait -= dt;
    if (k < want && !o.on && o.wait <= 0) placeOrb(o);
    if (!o.on) continue;
    o.ph += dt * 3; o.m.position.set(o.x, 0.5 + Math.sin(o.ph) * 0.12, o.z); o.m.rotation.y = o.ph;
    if (state === 'play' && Math.hypot(o.x - px, o.z - pz) < 0.9) {
      charge++; sfxPick(charge);
      spawnDebris(o.x, 0.5, o.z, 4, 6, 0.5, 0.5); spawnFlash(o.x, 0.5, o.z, 4, 1.2, 0.15);
      if (charge >= 10) { charge = 0; fireWave(); }
      setDots();
      o.on = false; o.m.setEnabled(false); o.wait = 0.9;
    }
  }
}
function updateFx(dt, rdt) {
  for (const f of flashes) {
    if (!f.on) continue; f.t += dt; const k = f.t / f.dur;
    if (k >= 1) { f.on = false; f.m.setEnabled(false); continue; }
    const s = f.s * (0.3 + 0.7 * Math.sqrt(k)); f.m.scaling.set(s, s, s); f.mat.alpha = (1 - k) * (1 - k);
  }
  for (const L of lights) { L.v *= Math.exp(-dt * 7); L.l.intensity = L.v < 0.02 ? 0 : L.v; }
  aberr *= Math.exp(-rdt * 5); pipe.chromaticAberration.aberrationAmount = aberr;
  shake *= Math.exp(-rdt * 7);
  cam.target.set((Math.random() * 2 - 1) * shake, 0, (Math.random() * 2 - 1) * shake);
}
function writeInstances() {
  for (const p of ePools) p.n = 0;
  for (const p of dPools) p.n = 0;
  for (let i = 0; i < E.n; i++) {
    const age = E.age[i], s = Math.min(1, age * 3);
    ePools[E.type[i]].push(E.x[i], 0.6 + Math.sin(E.ph[i] + age * 3) * 0.12, E.z[i], E.a[i], E.b[i], s);
  }
  for (let i = 0; i < D.n; i++) {
    const s = D.size[i] * Math.min(1, D.life[i] / (D.max[i] * 0.45));
    dPools[D.col[i]].push(D.x[i], D.y[i], D.z[i], D.a[i], D.b[i], s);
  }
  for (const p of ePools) p.commit();
  for (const p of dPools) p.commit();
}

// ---------- Frame ----------
let fpsFrames = 0, fpsT = performance.now(), fps = 0, hudT = 0, last = performance.now();
function frame(rdt, now) {
  if (slowT > 0) { slowT -= rdt; ts += (0.22 - ts) * Math.min(1, rdt * 20); }
  else ts += (1 - ts) * Math.min(1, rdt * 3.5);
  const dt = rdt * ts;
  simT += dt;

  if (state === 'play') {
    t += dt; score += 10 * dt;
    const L = Math.floor(t / 15);
    if (L !== level) { level = L; sfxLevel(); $('lvl').classList.add('flash'); setTimeout(() => $('lvl').classList.remove('flash'), 250); }
    spawnT -= dt;
    if (spawnT <= 0) { if (E.n < Math.min(12 + 8 * level, 220)) spawnSwarm(); spawnT = Math.max(0.55, 2.0 - 0.17 * level); }
  } else if (state === 'title') {
    attractT -= dt;
    while (E.n < 34) spawnOrbitEnemy(0, 0, 12);
    if (attractT <= 0 && E.n > 0) { attractT = 1.4 + Math.random(); const i = (Math.random() * E.n) | 0; kill(i, false); }
  } else if (state === 'stress') {
    ST.t += rdt; ST.target += (60 + ST.target * 0.22) * rdt;
    const eT = ST.target * 0.5, dT = ST.target * 0.5;
    for (let k = 0; k < 400 && E.n < eT; k++) spawnOrbitEnemy(px, pz, 16);
    for (let k = 0; k < 16 && D.n < dT; k++) {
      const z = BD.zN + Math.random() * (BD.zF - BD.zN), x = (Math.random() * 2 - 1) * halfAt(z);
      spawnDebris(x, 0.6, z, (Math.random() * 4) | 0, 40, 1, 5);
    }
    ST.burstT -= rdt;
    if (ST.burstT <= 0) { ST.burstT = 0.15; const z = BD.zN + Math.random() * (BD.zF - BD.zN); const x = (Math.random() * 2 - 1) * halfAt(z);
      spawnFlash(x, 0.6, z, (Math.random() * 4) | 0, 2, 0.25); spawnLight(x, z, (Math.random() * 4) | 0, 2.5, 12); }
  }

  updatePlayer(rdt);
  buildGrid();
  updateEnemies(dt);
  updateWaves(dt);
  compactEnemies();
  updateOrbs(dt);
  updateDebris(dt);
  updateFx(dt, rdt);

  if (comboT > 0) {
    comboT -= dt;
    if (comboT <= 0) {
      if (combo >= 5 && bigN === 0 && state === 'play') popup(lastKX, lastKZ, 'Combo x' + combo, '#ffb12e', false);
      combo = 0; nextBig = 8; bigN = 0; if (state !== 'stress') comboEl.classList.remove('on');
    }
  }
  if (closeT > 0) { closeT -= rdt; if (closeT <= 0 && state === 'play') { popup(px, pz + 1.2, 'Close! +' + closeAcc, '#9ff6ff', false); closeAcc = 0; } }

  writeInstances();

  // perf + HUD
  fpsFrames++;
  if (now - fpsT >= 500) { fps = fpsFrames * 1000 / (now - fpsT); fpsFrames = 0; fpsT = now; }
  const objs = E.n + D.n;
  if (state === 'stress') {
    ST.peak = Math.max(ST.peak, objs);
    ST.frames.push(now); while (ST.frames.length > 2 && now - ST.frames[0] > 3000) ST.frames.shift();
    const span = (ST.frames[ST.frames.length - 1] - ST.frames[0]) / 1000;
    const avg = span > 0 ? (ST.frames.length - 1) / span : 60;
    if (ST.t > 3.2 && avg < 50) { endStress(avg, false); return; }
    if (objs > 250000) { endStress(avg, true); return; }
    ST.avg = avg;
  }
  hudT -= rdt;
  if (hudT <= 0) {
    hudT = 0.1;
    perfEl.textContent = Math.round(fps) + ' fps\n' + objs.toLocaleString('en-US') + ' objects' +
      (state === 'stress' && ST.avg ? '\n3 s avg ' + ST.avg.toFixed(1) + ' fps' : '');
    if (state === 'play') { scoreEl.textContent = Math.floor(score).toLocaleString('en-US'); lvlFill.style.width = ((t % 15) / 15 * 100) + '%'; }
  }
}

engine.runRenderLoop(() => {
  const now = performance.now();
  let rdt = (now - last) / 1000; last = now;
  if (rdt > 0.05) rdt = 0.05;
  if (state !== 'boot') frame(rdt, now);
  scene.render();
});

// boot
onResize();
toTitle();
scene.executeWhenReady(() => {
  $('tapMsg').textContent = 'Tap to start';
  $('stressBtn').hidden = false;
});
// Test hook (used by the automated play-through; harmless for players)
window.__ns = { get state() { return state; }, get objects() { return E.n + D.n; }, get score() { return score; },
  get info() { return { t, level, charge, kills, combo, enemies: E.n, debris: D.n, px, pz }; },
  aim(x, z) { tx = x; tz = z; }, step(dt) { frame(dt, performance.now()); }, orbs, E };
})();
</script>
</body>
</html>
