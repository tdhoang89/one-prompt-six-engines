<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05030d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Neon Swarm</title>
<style>
:root{
  --ink:#eaf6ff; --cyan:#00f0ff; --pink:#ff2bd6; --gold:#ffe600; --void:#05030d;
  --face:"Bahnschrift","DIN Alternate","Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--void);overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;font-family:var(--face);color:var(--ink);font-variant-numeric:tabular-nums}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#hud{position:absolute;inset:0;pointer-events:none;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#tl{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top))}
.lbl{font-size:12px;letter-spacing:.06em;opacity:.7}
#score{font-size:clamp(26px,6vmin,44px);font-weight:700;line-height:1;color:#fff;text-shadow:0 0 8px var(--cyan),0 0 22px rgba(0,240,255,.6)}
.sub{font-size:13px;margin-top:4px;opacity:.85;color:var(--gold);text-shadow:0 0 8px rgba(255,230,0,.6)}
#perf{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));
  font-size:12px;line-height:1.35;text-align:right;padding:5px 8px;border-radius:6px;background:rgba(10,4,30,.55);border:1px solid rgba(164,107,255,.35)}
#perf b{color:var(--cyan);font-weight:700}
#combo{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);font-size:clamp(20px,5vmin,34px);
  font-weight:700;color:var(--pink);text-shadow:0 0 10px var(--pink),0 0 26px rgba(255,43,214,.7);opacity:0;white-space:nowrap}
#stressLbl{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:15px;
  color:var(--gold);text-shadow:0 0 10px rgba(255,230,0,.8);display:none;white-space:nowrap}
#pips{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:5px}
#pips i{width:14px;height:5px;border-radius:3px;background:rgba(125,255,58,.18);transition:background .1s}
#pips i.on{background:#7dff3a;box-shadow:0 0 8px #7dff3a}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;
  padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.ov.hidden{display:none}
h1{margin:0;font-size:clamp(46px,14vmin,104px);font-weight:300;letter-spacing:.04em;line-height:.95;color:#fff;
  text-shadow:0 0 4px #fff,0 0 14px var(--cyan),0 0 34px var(--cyan),0 0 70px rgba(255,43,214,.8)}
h1 span{display:block;font-weight:700;color:#ffd6f6;text-shadow:0 0 4px #fff,0 0 14px var(--pink),0 0 36px var(--pink),0 0 70px rgba(0,240,255,.6)}
h2{margin:0 0 10px;font-size:clamp(40px,11vmin,80px);font-weight:700;color:#fff;text-shadow:0 0 6px #fff,0 0 20px var(--pink),0 0 48px var(--pink)}
.ov p{margin:6px 0;font-size:clamp(16px,4.2vmin,22px)}
.big{font-size:clamp(28px,8vmin,52px)!important;font-weight:700;color:#fff;text-shadow:0 0 12px var(--cyan),0 0 30px var(--cyan)}
.best{color:var(--gold);text-shadow:0 0 10px rgba(255,230,0,.7)}
.tap{margin-top:22px!important;color:var(--cyan);text-shadow:0 0 10px var(--cyan);animation:breathe 1.6s ease-in-out infinite}
.hint{font-size:13px!important;opacity:.6;max-width:30em}
.newbest{color:var(--gold);font-weight:700;text-shadow:0 0 14px var(--gold)}
@keyframes breathe{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.tap{animation:none}}
#stressBtn{pointer-events:auto;margin-top:26px;font:inherit;font-size:16px;color:var(--gold);background:rgba(255,230,0,.06);
  border:1.5px solid rgba(255,230,0,.75);border-radius:999px;padding:10px 26px;box-shadow:0 0 14px rgba(255,230,0,.35),inset 0 0 10px rgba(255,230,0,.2);
  text-shadow:0 0 8px rgba(255,230,0,.8);cursor:pointer;touch-action:manipulation}
#stressBtn:focus-visible{outline:2px solid #fff;outline-offset:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="tl"><div class="lbl">Score</div><div id="score">0</div><div class="sub">Best <span id="best">0</span></div></div>
  <div id="perf">FPS <b id="fps">0</b><br>Objects <b id="obj">0</b></div>
  <div id="combo">Combo x<span id="cv">0</span></div>
  <div id="pips"></div>
  <div id="stressLbl"></div>
</div>
<div id="menu" class="ov">
  <h1>Neon<span>Swarm</span></h1>
  <p class="best" style="margin-top:20px">Best <span id="mbest">0</span></p>
  <p class="tap">Tap to start</p>
  <p class="hint">Drag to move. Collect 10 orbs to fire a blast.</p>
  <button id="stressBtn" type="button">Stress test</button>
</div>
<div id="over" class="ov hidden">
  <h2>Game over</h2>
  <p>Score <span id="oscore">0</span></p>
  <p class="best">Best <span id="obest">0</span></p>
  <p class="newbest" id="onew">New best!</p>
  <p class="tap">Tap to play again</p>
</div>
<div id="sres" class="ov hidden">
  <h2 style="font-size:clamp(30px,8vmin,56px)">Stress test</h2>
  <p>Max objects</p>
  <p class="big" id="smax">0</p>
  <p id="sdet" style="font-size:15px;opacity:.85"></p>
  <p class="tap">Tap to continue</p>
</div>
<script>
'use strict';
/* =========================================================
   Neon Swarm — HTML5 Canvas 2D, no libraries
   ========================================================= */
const TAU = Math.PI * 2, rnd = Math.random;
const $ = id => document.getElementById(id);
const cv = $('c');
const ctx = cv.getContext('2d', { alpha: false });

/* ---------- palette ---------- */
const PAL = ['#ff2bd6', '#00f0ff', '#ffe600', '#ff7a1a', '#7dff3a', '#a46bff', '#ffffff'];
const RGB = PAL.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
const LV_A = [0.28, 0.5, 0.75, 1];
const STY = [];
for (let c = 0; c < PAL.length; c++) for (let l = 0; l < 4; l++) STY.push(`rgba(${RGB[c][0]},${RGB[c][1]},${RGB[c][2]},${LV_A[l]})`);
const hexA = (h, a) => { const i = PAL.indexOf(h), r = i >= 0 ? RGB[i] : [255, 255, 255]; return `rgba(${r[0]},${r[1]},${r[2]},${a})`; };

/* ---------- glow support detection (native canvas filter) ---------- */
let FILTER_OK = false;
(function () {
  try {
    const t = document.createElement('canvas'); t.width = t.height = 9;
    const c = t.getContext('2d');
    c.filter = 'blur(2px)';
    if (c.filter !== 'blur(2px)') return;
    c.fillStyle = '#fff'; c.fillRect(4, 4, 1, 1);
    FILTER_OK = c.getImageData(2, 4, 1, 1).data[3] > 0;
  } catch (e) { FILTER_OK = false; }
})();

/* ---------- sizes ---------- */
let W = 0, H = 0, DPR = 1, U = 1, PR = 6, ER = 10;
const bcA = document.createElement('canvas'), bA = bcA.getContext('2d');
const bcB = document.createElement('canvas'), bB = bcB.getContext('2d');
const bcC = document.createElement('canvas'), bC = bcC.getContext('2d');
const bgC = document.createElement('canvas'), bgX = bgC.getContext('2d');
let SPR = [], SPRH = [], GLOW = [], SPR_HALF = 10, GLOW_R = 32;

function polyPath(c, type, R) {
  c.beginPath();
  if (type === 2) { c.moveTo(0, -R * 1.3); c.lineTo(R * 0.78, 0); c.lineTo(0, R * 1.3); c.lineTo(-R * 0.78, 0); c.closePath(); return; }
  const n = [3, 4, 0, 6, 5][type], off = type === 1 ? Math.PI / 4 : -Math.PI / 2;
  const rr = type === 0 ? R * 1.25 : type === 1 ? R * 1.1 : R;
  for (let i = 0; i < n; i++) { const a = off + i * TAU / n; i ? c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : c.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  c.closePath();
}
function makeEnemySprite(type, col, hot) {
  const R = ER * DPR, pad = Math.ceil(11 * DPR * U), S = Math.ceil((R * 1.35 + pad) * 2);
  const k = document.createElement('canvas'); k.width = k.height = S;
  const c = k.getContext('2d');
  c.translate(S / 2, S / 2); c.lineJoin = 'round';
  c.shadowColor = col; c.shadowBlur = pad * 0.85;
  polyPath(c, type, R); c.fillStyle = hexA(col, hot ? 0.5 : 0.16); c.fill();
  c.lineWidth = 2.4 * DPR; c.strokeStyle = hot ? '#ffffff' : col; c.stroke(); c.stroke();
  c.shadowBlur = 0; polyPath(c, type, R * 0.5);
  c.lineWidth = 1.2 * DPR; c.strokeStyle = hot ? '#ffffff' : hexA('#ffffff', 0.5); c.stroke();
  return k;
}
function makeGlow(col, r) {
  const S = Math.ceil(r * 2 * DPR), k = document.createElement('canvas'); k.width = k.height = S;
  const c = k.getContext('2d'), g = c.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, hexA(col, 0.9)); g.addColorStop(0.18, hexA(col, 0.45)); g.addColorStop(0.5, hexA(col, 0.12)); g.addColorStop(1, hexA(col, 0));
  c.fillStyle = g; c.fillRect(0, 0, S, S);
  return k;
}
function buildSprites() {
  SPR = []; SPRH = [];
  for (let t = 0; t < 5; t++) for (let c = 0; c < 6; c++) { SPR.push(makeEnemySprite(t, PAL[c], false)); SPRH.push(makeEnemySprite(t, PAL[c], true)); }
  SPR_HALF = SPR[0].width / DPR / 2;
  GLOW_R = 32 * U; GLOW = PAL.map(p => makeGlow(p, GLOW_R));
}
function buildBG() {
  bgC.width = cv.width; bgC.height = cv.height;
  const c = bgX, w = bgC.width, h = bgC.height;
  c.fillStyle = '#05030d'; c.fillRect(0, 0, w, h);
  let g = c.createRadialGradient(w / 2, h * 0.45, 0, w / 2, h * 0.45, Math.max(w, h) * 0.7);
  g.addColorStop(0, 'rgba(46,18,92,0.55)'); g.addColorStop(0.6, 'rgba(18,8,40,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  const step = 46 * U * DPR;
  c.strokeStyle = 'rgba(140,80,255,0.085)'; c.lineWidth = Math.max(1, DPR);
  c.beginPath();
  for (let x = (w / 2) % step; x < w; x += step) { c.moveTo(x | 0, 0); c.lineTo(x | 0, h); }
  for (let y = (h / 2) % step; y < h; y += step) { c.moveTo(0, y | 0); c.lineTo(w, y | 0); }
  c.stroke();
  g = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.hypot(w, h) * 0.6);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
}

function resize() {
  const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (w === W && h === H && dpr === DPR && cv.width > 0) return;
  const ow = W, oh = H;
  W = w; H = h; DPR = dpr;
  U = Math.max(0.8, Math.min(1.5, Math.min(W, H) / 430));
  PR = 6.5 * U; ER = 10 * U;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  bcA.width = Math.ceil(cv.width / 4); bcA.height = Math.ceil(cv.height / 4);
  bcB.width = Math.ceil(cv.width / 8); bcB.height = Math.ceil(cv.height / 8);
  bcC.width = Math.ceil(cv.width / 16); bcC.height = Math.ceil(cv.height / 16);
  buildBG(); buildSprites();
  if (ow > 0 && oh > 0) {               // rotate / fold / unfold: keep relative layout
    const sx = W / ow, sy = H / oh;
    for (const e of enemies) { e.x *= sx; e.y *= sy; }
    for (const o of orbs) { o.x *= sx; o.y *= sy; }
    for (let i = 0; i < pn; i++) { px[i] *= sx; py[i] *= sy; }
    player.x *= sx; player.y *= sy; tx *= sx; ty *= sy; trail.length = 0;
    for (const w2 of waves) { w2.x *= sx; w2.y *= sy; }
  }
}

/* ---------- particles (struct-of-arrays) ---------- */
let PCAP = 4096, pn = 0;
let px = new Float32Array(PCAP), py = new Float32Array(PCAP), pvx = new Float32Array(PCAP), pvy = new Float32Array(PCAP),
  pl = new Float32Array(PCAP), pm = new Float32Array(PCAP), prt = new Float32Array(PCAP), pw = new Float32Array(PCAP),
  ps = new Float32Array(PCAP), pc = new Uint8Array(PCAP), pk = new Uint8Array(PCAP);
function growP() {
  const n = PCAP * 2;
  const g = (a, T) => { const b = new T(n); b.set(a); return b; };
  px = g(px, Float32Array); py = g(py, Float32Array); pvx = g(pvx, Float32Array); pvy = g(pvy, Float32Array);
  pl = g(pl, Float32Array); pm = g(pm, Float32Array); prt = g(prt, Float32Array); pw = g(pw, Float32Array);
  ps = g(ps, Float32Array); pc = g(pc, Uint8Array); pk = g(pk, Uint8Array); PCAP = n;
}
const PLAY_PCAP = 5000;
function addP(x, y, vx, vy, life, c, k, s) {
  if (state !== 'stress' && pn >= PLAY_PCAP) return;
  if (pn >= PCAP) growP();
  const i = pn++;
  px[i] = x; py[i] = y; pvx[i] = vx; pvy[i] = vy; pl[i] = life; pm[i] = life; pc[i] = c; pk[i] = k; ps[i] = s;
  prt[i] = rnd() * TAU; pw[i] = (rnd() - 0.5) * 18;
}
function burst(x, y, c, n, spd, life) {
  for (let k = 0; k < n; k++) {
    const a = rnd() * TAU, s = spd * (0.25 + rnd() * 0.95), shard = k < n * 0.35;
    addP(x, y, Math.cos(a) * s, Math.sin(a) * s, life * (0.55 + rnd() * 0.7), c, shard ? 1 : 0, shard ? (2.5 + rnd() * 4) * U : 0);
  }
}
function updateParticles(dt) {
  const drag = Math.exp(-2.3 * dt);
  let i = 0;
  while (i < pn) {
    pl[i] -= dt;
    if (pl[i] <= 0) {
      const j = --pn;
      px[i] = px[j]; py[i] = py[j]; pvx[i] = pvx[j]; pvy[i] = pvy[j]; pl[i] = pl[j]; pm[i] = pm[j];
      prt[i] = prt[j]; pw[i] = pw[j]; ps[i] = ps[j]; pc[i] = pc[j]; pk[i] = pk[j];
      continue;
    }
    pvx[i] *= drag; pvy[i] *= drag; px[i] += pvx[i] * dt; py[i] += pvy[i] * dt; prt[i] += pw[i] * dt;
    i++;
  }
}

/* ---------- world state ---------- */
let state = 'menu';
const enemies = [], orbs = [], waves = [], flashes = [], texts = [], trail = [];
const player = { x: 0, y: 0, alive: false };
let tx = 0, ty = 0, pointerSeen = false;
let T = 0, aliveT = 0, bonus = 0, kills = 0, combo = 0, comboTimer = 0, comboPop = 0, energy = 0;
let level = 0, levelT = 0, spawnT = 0, shake = 0, ts = 1, slowT = 0, levelFlash = 0, nextSlow = 0, deadAt = 0;
const SLOWS = [12, 25, 45, 70, 100, 140, 190, 250, 320, 400];
let best = 0;
try { best = Math.max(0, parseInt(localStorage.getItem('neonSwarm.best') || '0', 10) || 0); } catch (e) { best = 0; }
function saveBest() { try { localStorage.setItem('neonSwarm.best', String(best)); } catch (e) { /* storage blocked: keep playing */ } }
const score = () => Math.floor(aliveT * 10) + bonus;

/* ---------- spatial grid ---------- */
let gCell = 56, gOx = 0, gOy = 0, gCols = 1, gRows = 1, gHead = new Int32Array(1), gNext = new Int32Array(1);
function buildGrid() {
  gCell = 56 * U; const pad = 320 * U; gOx = -pad; gOy = -pad;
  gCols = Math.ceil((W + pad * 2) / gCell) + 1; gRows = Math.ceil((H + pad * 2) / gCell) + 1;
  const size = gCols * gRows;
  if (gHead.length < size) gHead = new Int32Array(size);
  gHead.fill(-1, 0, size);
  if (gNext.length < enemies.length) gNext = new Int32Array(enemies.length * 2 + 16);
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i]; if (e.state === 2) continue;
    let cx = ((e.x - gOx) / gCell) | 0, cy = ((e.y - gOy) / gCell) | 0;
    cx = cx < 0 ? 0 : cx >= gCols ? gCols - 1 : cx; cy = cy < 0 ? 0 : cy >= gRows ? gRows - 1 : cy;
    const idx = cy * gCols + cx; gNext[i] = gHead[idx]; gHead[idx] = i;
  }
}
function primeNeighbors(x, y) {
  const R = 52 * U, R2 = R * R;
  const cx = ((x - gOx) / gCell) | 0, cy = ((y - gOy) / gCell) | 0;
  for (let gy = cy - 1; gy <= cy + 1; gy++) {
    if (gy < 0 || gy >= gRows) continue;
    for (let gx = cx - 1; gx <= cx + 1; gx++) {
      if (gx < 0 || gx >= gCols) continue;
      for (let j = gHead[gy * gCols + gx]; j !== -1; j = gNext[j]) {
        const o = enemies[j]; if (o.state !== 0) continue;
        const dx = o.x - x, dy = o.y - y;
        if (dx * dx + dy * dy < R2) { o.state = 1; o.timer = 0.06 + rnd() * 0.08; }
      }
    }
  }
}

/* ---------- entities ---------- */
function makeEnemy(x, y, type, col, sp) {
  return { x, y, vx: 0, vy: 0, t: type, c: col, sp, ph: rnd() * TAU, wf: 1.2 + rnd() * 1.8, rot: rnd() * TAU, vr: (rnd() - 0.5) * 5,
    state: 0, timer: 0, graze: 0, orbit: false, oa: 0, ow: 0, orad: 0 };
}
function edgePoint(m) {
  const s = (rnd() * 4) | 0;
  if (s === 0) return [rnd() * W, -m]; if (s === 1) return [W + m, rnd() * H];
  if (s === 2) return [rnd() * W, H + m]; return [-m, rnd() * H];
}
function spawnSwarm(n, speed) {
  const [sx, sy] = edgePoint(40 * U), type = (rnd() * 5) | 0, col = (rnd() * 6) | 0;
  const spread = 26 * U * Math.sqrt(n);
  const dx = player.x - sx, dy = player.y - sy, d = Math.hypot(dx, dy) || 1;
  for (let k = 0; k < n; k++) {
    const a = rnd() * TAU, r = Math.sqrt(rnd()) * spread;
    const e = makeEnemy(sx + Math.cos(a) * r, sy + Math.sin(a) * r, type, col, 0.85 + rnd() * 0.3);
    e.vx = dx / d * speed * 0.6; e.vy = dy / d * speed * 0.6;
    enemies.push(e);
  }
}
function spawnOrbiter() {
  const [sx, sy] = edgePoint(30 * U);
  const e = makeEnemy(sx, sy, (rnd() * 5) | 0, (rnd() * 6) | 0, 0.8 + rnd() * 0.4);
  e.orbit = true; e.oa = rnd() * TAU; e.ow = (rnd() < 0.5 ? -1 : 1) * (0.3 + rnd() * 0.6);
  e.orad = 30 * U + rnd() * Math.min(W, H) * 0.45;
  enemies.push(e);
}
function orbTarget() { return Math.max(4, Math.min(8, Math.round(3 + W * H / 160000))); }
function spawnOrb() {
  const m = 34 * U;
  let x = 0, y = 0;
  for (let k = 0; k < 24; k++) {
    x = m + rnd() * (W - 2 * m); y = m + 60 + rnd() * (H - 2 * m - 90);
    if (Math.hypot(x - player.x, y - player.y) > 150 * U) break;
  }
  orbs.push({ x, y, ph: rnd() * TAU, born: 0 });
}
function addText(x, y, s, col, size) {
  if (texts.length > 16) texts.shift();
  texts.push({ x, y, s, col, size, l: 1 });
}

/* ---------- audio (Web Audio API) ---------- */
let AC = null, MG = null, NB = null, lastBoom = 0;
function audioInit() {
  if (!AC) {
    try {
      const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
      AC = new A();
      const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 6;
      MG = AC.createGain(); MG.gain.value = 0.55; MG.connect(comp); comp.connect(AC.destination);
      NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
}
function osc(type, f0, f1, dur, vol, at) {
  if (!AC) return;
  const t = AC.currentTime + (at || 0), o = AC.createOscillator(), g = AC.createGain();

  }

  // floating text
  if (texts.length) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const t of texts) {
      ctx.globalAlpha = Math.min(1, t.l * 1.5);
      ctx.font = `700 ${t.size | 0}px ${getComputedFace()}`;
      ctx.fillStyle = t.col; ctx.fillText(t.s, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  }

  doBloom();

  if (levelFlash > 0) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = levelFlash * 0.7; ctx.strokeStyle = '#ff2bd6'; ctx.lineWidth = 10 * U;
    ctx.strokeRect(0, 0, W, H); ctx.globalAlpha = 1;
  }
}
let FACE = null;
function getComputedFace() { return FACE || (FACE = getComputedStyle(document.body).fontFamily || 'sans-serif'); }

/* ---------- HUD ---------- */
const fmt = n => Math.floor(n).toLocaleString('en-US');
const hud = { score: $('score'), best: $('best'), fps: $('fps'), obj: $('obj'), combo: $('combo'), cv: $('cv'), sl: $('stressLbl') };
function setT(el, v) { if (el._v !== v) { el._v = v; el.textContent = v; } }
const pips = $('pips'); for (let i = 0; i < 10; i++) pips.appendChild(document.createElement('i'));
let pipsShown = -1;
function updateHud(avg3) {
  const s = score();
  setT(hud.score, fmt(state === 'play' || state === 'dead' ? s : 0));
  setT(hud.best, fmt(Math.max(best, state === 'play' ? s : 0)));
  setT(hud.fps, String(Math.round(fps)));
  setT(hud.obj, fmt(enemies.length + pn));
  const showC = state === 'play' && combo >= 2;
  hud.combo.style.opacity = showC ? '1' : '0';
  if (showC) { setT(hud.cv, String(combo)); hud.combo.style.transform = `translateX(-50%) scale(${1 + comboPop * 0.35})`; }
  if (state === 'stress') setT(hud.sl, `Stress test · avg FPS (3 s) ${avg3 ? avg3.toFixed(1) : '…'}`);
  const pe = state === 'play' ? energy : 0;
  if (pe !== pipsShown) { pipsShown = pe; for (let i = 0; i < 10; i++) pips.children[i].className = i < pe ? 'on' : ''; }
}

/* ---------- main loop ---------- */
let last = performance.now(), fps = 60, fpsFrames = 0, fpsT = last;
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = (now - last) / 1000; last = now;
  if (rdt > 0.05) rdt = 0.05; if (rdt < 0) rdt = 0;
  fpsFrames++;
  if (now - fpsT >= 500) { fps = fpsFrames * 1000 / (now - fpsT); fpsFrames = 0; fpsT = now; }

  // slow motion on big chain reactions
  if (slowT > 0) { slowT -= rdt; ts = 0.22; } else ts += (1 - ts) * (1 - Math.exp(-6 * rdt));
  update(rdt * ts, rdt);
  render();

  let avg3 = 0;
  if (state === 'stress') {
    frameTimes.push(now);
    while (frameTimes.length && frameTimes[0] < now - 3000) frameTimes.shift();
    const objs = enemies.length + pn;
    if (objs > stressPeak) { stressPeak = objs; stressPeakE = enemies.length; stressPeakP = pn; }
    if (now - stressWin0 >= 3000) {
      avg3 = frameTimes.length / 3;
      if (avg3 < 50 || objs > 250000) endStress(avg3);
    }
  }
  updateHud(avg3);
}

resize();
$('mbest').textContent = fmt(best);
player.x = W / 2; player.y = H / 2;
requestAnimationFrame(t => { last = t; fpsT = t; requestAnimationFrame(frame); });
</script>
</body>
