<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06040f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Neon Swarm</title>
<style>
:root{
  --void:#06040f; --ink:#eafcff; --dim:#8c88bb; --soft:#bdb8ea;
  --cyan:#19e3ff; --mag:#ff2e88; --amber:#ffb020; --violet:#9e5cff; --mint:#74ffb0;
  --font:"Avenir Next","Segoe UI Variable Display","SF Pro Display",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--ink);
  font-family:var(--font);overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:absolute;inset:0;pointer-events:none}
#tl{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left))}
#tl .lbl{font-size:12px;letter-spacing:.06em;color:var(--dim)}
#score{font-size:clamp(28px,7vmin,46px);font-weight:300;line-height:1.02;font-variant-numeric:tabular-nums;
  text-shadow:0 0 10px rgba(25,227,255,.75),0 0 28px rgba(25,227,255,.35)}
#best{font-size:13px;color:var(--soft);margin-top:3px;font-variant-numeric:tabular-nums}
#tr{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));
  text-align:right;font-size:12px;line-height:1.5;color:var(--soft);font-variant-numeric:tabular-nums}
#tr b{color:var(--ink);font-weight:600}
#combo{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 9vh);transform:translateX(-50%);
  font-size:clamp(22px,6vmin,40px);font-weight:700;opacity:0;color:#fff;white-space:nowrap;
  text-shadow:0 0 8px var(--mag),0 0 24px var(--mag);transition:opacity .25s}
#combo.on{opacity:1}
#combo.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:translateX(-50%) scale(1.4)}100%{transform:translateX(-50%) scale(1)}}
#pips{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:5px}
#pips i{display:block;width:clamp(14px,4vmin,22px);height:5px;border-radius:3px;background:rgba(116,255,176,.15)}
#pips i.f{background:var(--mint);box-shadow:0 0 8px var(--mint)}
#stressTag{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);
  font-size:13px;color:var(--amber);text-shadow:0 0 10px var(--amber);display:none;text-align:center;line-height:1.5}
.fl{position:absolute;left:0;top:0;font-weight:700;font-size:19px;color:#fff;opacity:0;white-space:nowrap;
  text-shadow:0 0 8px var(--amber),0 0 20px var(--amber);will-change:transform,opacity}
.fl.go{animation:rise .85s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-50%) translateY(8px) scale(.8)}
  14%{opacity:1;transform:translate(-50%,-50%) translateY(-6px) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-50%) translateY(-48px) scale(1)}}
/* screens */
#screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.panel{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 22px;
  background:radial-gradient(closest-side,rgba(6,4,15,.72),rgba(6,4,15,0));min-width:min(92vw,420px)}
.panel.hidden{display:none}
h1{margin:0;font-size:clamp(46px,15vmin,104px);font-weight:200;line-height:.92;letter-spacing:.04em;color:transparent;
  -webkit-text-stroke:1.6px #bff6ff;text-shadow:0 0 12px rgba(25,227,255,.9),0 0 38px rgba(25,227,255,.55),0 0 80px rgba(255,46,136,.35);
  animation:ignite 1.6s steps(1,end) 1}
@keyframes ignite{0%{opacity:.15}12%{opacity:1}18%{opacity:.3}26%{opacity:1}31%{opacity:.5}36%{opacity:1}}
h2{margin:0 0 6px;font-size:clamp(28px,8vmin,48px);font-weight:300;color:#fff;
  text-shadow:0 0 12px var(--mag),0 0 34px rgba(255,46,136,.6)}
.big{font-size:clamp(40px,12vmin,72px);font-weight:200;line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px rgba(25,227,255,.8)}
.sub{font-size:13px;color:var(--dim);margin-top:4px}
.tap{margin:22px 0 0;font-size:clamp(17px,4.6vmin,22px);color:#fff;text-shadow:0 0 10px var(--cyan);
  animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.hint{margin:10px 0 0;font-size:13px;color:var(--soft);max-width:32ch;line-height:1.45}
.bestline{margin:10px 0 0;font-size:14px;color:var(--soft);font-variant-numeric:tabular-nums}
#stressBtn{pointer-events:auto;margin-top:22px;font:inherit;font-size:14px;color:var(--amber);background:rgba(255,176,32,.06);
  border:1px solid rgba(255,176,32,.55);border-radius:999px;padding:9px 20px;cursor:pointer;
  box-shadow:0 0 14px rgba(255,176,32,.25) inset,0 0 14px rgba(255,176,32,.2);touch-action:manipulation}
#stressBtn:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--soft)}
@media (prefers-reduced-motion:reduce){h1,.tap{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="hud">
  <div id="tl"><div class="lbl">Score</div><div id="score">0</div><div id="best">Best 0</div></div>
  <div id="tr"><div>FPS <b id="fps">--</b></div><div>Objects <b id="obj">0</b></div><div>Draw calls <b id="dc">0</b></div></div>
  <div id="combo"></div>
  <div id="stressTag"></div>
  <div id="pips"></div>
  <div id="floats"></div>
</div>

<div id="screen">
  <div class="panel" id="pTitle">
    <h1>Neon<br>Swarm</h1>
    <p class="tap">Tap to start</p>
    <p class="hint">Steer with one finger. Grab 10 orbs to release a shockwave. Don’t touch the swarm.</p>
    <p class="bestline">Best <span id="tBest">0</span></p>
    <button id="stressBtn" type="button">Stress test</button>
  </div>
  <div class="panel hidden" id="pOver">
    <h2>Game over</h2>
    <div class="big" id="oScore">0</div><div class="sub">Score</div>
    <p class="bestline" id="oBest">Best 0</p>
    <p class="tap">Tap to start</p>
  </div>
  <div class="panel hidden" id="pStress">
    <h2>Stress test</h2>
    <div class="big" id="sMax">0</div><div class="sub">Max objects (enemies + debris)</div>
    <p class="bestline" id="sInfo"></p>
    <p class="tap">Tap to continue</p>
  </div>
</div>
<div id="err"></div>

<script src="https://cdn.jsdelivr.net/npm/playcanvas@2.23.3/build/playcanvas.min.js"></script>
<script>
(function () {
'use strict';

/* =====================================================================
   Neon Swarm — PlayCanvas Engine 2.23.3 (engine only, no Editor)
   Glow: built-in CameraFrame (HDR + bloom + vignette + fringing).
   Swarm, debris, trail: hardware instancing (1 draw call per group).
   ===================================================================== */

const $ = (id) => document.getElementById(id);
const DEG = Math.PI / 180;
const rand = Math.random;
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function fail(msg) {
  const e = $('err'); e.style.display = 'flex'; e.textContent = msg;
  $('screen').style.display = 'none'; $('hud').style.display = 'none';
}
if (!window.pc) { fail('Could not load the PlayCanvas engine. Check the connection and reload.'); return; }

/* ---------------- engine setup ---------------- */
const canvas = $('c');
let app;
try {
  app = new pc.Application(canvas, {
    graphicsDeviceOptions: { antialias: false, alpha: false, powerPreference: 'high-performance' }
  });
} catch (e) { fail('WebGL2 is not available on this device.'); return; }

const device = app.graphicsDevice;
device.maxPixelRatio = Math.min(window.devicePixelRatio || 1, 2);
app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
app.setCanvasResolution(pc.RESOLUTION_AUTO);
app.scene.ambientLight = new pc.Color(0.035, 0.028, 0.08);
const LP = app.scene.lighting;           // clustered lighting (default in 2.x)
LP.shadowsEnabled = false; LP.cookiesEnabled = false; LP.areaLightsEnabled = false;
LP.maxLightsPerCell = 16;

/* ---------------- palette ---------------- */
const PAL = {
  cube:  [1.00, 0.16, 0.52],
  pyr:   [0.08, 0.86, 1.00],
  octa:  [1.00, 0.66, 0.10],
  tetra: [0.60, 0.34, 1.00],
  ion:   [0.84, 0.97, 1.00],
  orb:   [0.42, 1.00, 0.66]
};
const col = (a, k = 1) => new pc.Color(a[0] * k, a[1] * k, a[2] * k);

function makeMat(o) {
  const m = new pc.StandardMaterial();
  m.useSkybox = false;
  m.emissive = col(o.c);
  m.emissiveIntensity = o.emis ?? 1;
  if (o.unlit) { m.useLighting = false; m.diffuse = new pc.Color(0, 0, 0); }
  else {
    m.diffuse = col(o.c, o.diff ?? 0.4);
    m.useMetalness = true; m.metalness = o.metal ?? 0.2; m.gloss = o.gloss ?? 0.6;
  }
  if (o.add) { m.blendType = pc.BLEND_ADDITIVE; m.depthWrite = false; }
  if (o.noCull) m.cull = pc.CULLFACE_NONE;
  m.update();
  return m;
}

/* ---------------- procedural meshes ---------------- */
// convex polyhedron from vertices + polygon faces; flat normals, winding fixed outward
function solidMesh(V, F) {
  const pos = [], nor = [], idx = [];
  for (const f of F) {
    const a = V[f[0]], b = V[f[1]], c = V[f[2]];
    let nx = (b[1]-a[1])*(c[2]-a[2]) - (b[2]-a[2])*(c[1]-a[1]);
    let ny = (b[2]-a[2])*(c[0]-a[0]) - (b[0]-a[0])*(c[2]-a[2]);
    let nz = (b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0]);
    let cx = 0, cy = 0, cz = 0;
    for (const vi of f) { cx += V[vi][0]; cy += V[vi][1]; cz += V[vi][2]; }
    let order = f.slice();
    if (nx*cx + ny*cy + nz*cz < 0) { order.reverse(); nx = -nx; ny = -ny; nz = -nz; }
    const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
    const base = pos.length / 3;
    for (const vi of order) { pos.push(V[vi][0], V[vi][1], V[vi][2]); nor.push(nx, ny, nz); }
    for (let k = 1; k < order.length - 1; k++) idx.push(base, base + k, base + k + 1);
  }
  const m = new pc.Mesh(device);
  m.setPositions(pos); m.setNormals(nor); m.setIndices(idx); m.update();
  return m;
}
function lineMesh(V, E, grow) {
  const pos = []; for (const v of V) pos.push(v[0]*grow, v[1]*grow, v[2]*grow);
  const m = new pc.Mesh(device);
  m.setPositions(pos); m.setIndices(E.flat()); m.update(pc.PRIMITIVE_LINES);
  return m;
}
const h = 0.62;
const SHAPES = {
  cube: {
    V: [[-h,-h,-h],[h,-h,-h],[h,h,-h],[-h,h,-h],[-h,-h,h],[h,-h,h],[h,h,h],[-h,h,h]],
    F: [[0,1,2,3],[4,5,6,7],[0,1,5,4],[3,2,6,7],[1,2,6,5],[0,3,7,4]],
    E: [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]]
  },
  pyr: {
    V: [[0,0.95,0],[-0.75,-0.5,-0.75],[0.75,-0.5,-0.75],[0.75,-0.5,0.75],[-0.75,-0.5,0.75]],
    F: [[1,2,3,4],[0,1,2],[0,2,3],[0,3,4],[0,4,1]],
    E: [[1,2],[2,3],[3,4],[4,1],[0,1],[0,2],[0,3],[0,4]]
  },
  octa: {
    V: [[0.95,0,0],[-0.95,0,0],[0,0.95,0],[0,-0.95,0],[0,0,0.95],[0,0,-0.95]],
    F: [[0,2,4],[4,2,1],[1,2,5],[5,2,0],[0,3,4],[4,3,1],[1,3,5],[5,3,0]],
    E: [[0,2],[0,3],[0,4],[0,5],[1,2],[1,3],[1,4],[1,5],[2,4],[4,3],[3,5],[5,2]]
  },
  tetra: {
    V: [[0.7,0.7,0.7],[0.7,-0.7,-0.7],[-0.7,0.7,-0.7],[-0.7,-0.7,0.7]],
    F: [[0,1,2],[0,1,3],[0,2,3],[1,2,3]],
    E: [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]]
  }
};
const shardMesh = solidMesh(SHAPES.tetra.V, SHAPES.tetra.F);
const sphereMesh = pc.Mesh.fromGeometry(device, new pc.SphereGeometry({ radius: 0.5, latitudeBands: 10, longitudeBands: 12 }));
const ringMesh = pc.Mesh.fromGeometry(device, new pc.TorusGeometry({ tubeRadius: 0.035, ringRadius: 1, segments: 64, sides: 6 }));

/* ---------------- instancing groups ---------------- */
const IFMT = pc.VertexFormat.getDefaultInstancingFormat(device);
class InstGroup {
  constructor(parts, cap = 128) {
    this.ent = new pc.Entity();
    this.mis = parts.map(p => new pc.MeshInstance(p.mesh, p.mat, this.ent));
    this.ent.addComponent('render', { meshInstances: this.mis, castShadows: false, receiveShadows: false });
    app.root.addChild(this.ent);
    this.n = 0; this.cap = 0; this.vb = null; this.f = null; this.fresh = true;
    this.alloc(cap);
  }
  alloc(cap) {
    const vb = new pc.VertexBuffer(device, IFMT, cap, { usage: pc.BUFFER_DYNAMIC });
    const f = new Float32Array(vb.lock());
    if (this.f) f.set(this.f.subarray(0, this.n * 16));
    for (const mi of this.mis) mi.setInstancing(vb);   // all parts share one matrix buffer
    if (this.vb) this.vb.destroy();
    this.vb = vb; this.f = f; this.cap = cap; this.fresh = true;
  }
  // matrix = T * Ry(b) * Rx(a) * S(s), column-major
  push(x, y, z, s, a, b) {
    if (this.n >= this.cap) this.alloc(this.cap * 2);
    const d = this.f, o = this.n++ * 16;
    const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b);
    d[o]    = cb*s;    d[o+1]  = 0;     d[o+2]  = -sb*s;   d[o+3]  = 0;
    d[o+4]  = sb*sa*s; d[o+5]  = ca*s;  d[o+6]  = cb*sa*s; d[o+7]  = 0;
    d[o+8]  = sb*ca*s; d[o+9]  = -sa*s; d[o+10] = cb*ca*s; d[o+11] = 0;
    d[o+12] = x;       d[o+13] = y;     d[o+14] = z;       d[o+15] = 1;
  }
  flush() {
    for (const mi of this.mis) mi.instancingCount = this.n;
    if (this.n > 0) {
      if (this.fresh) { this.vb.unlock(); this.fresh = false; }
      else this.vb.unlock(0, this.n * 64);
    }
    this.n = 0;
  }
}

/* ---------------- enemies: types ---------------- */
const TYPES = [
  { key: 'cube',  speed: 2.7, turn: 1.9,  scale: 0.56, from: 0 },
  { key: 'pyr',   speed: 3.5, turn: 1.15, scale: 0.58, from: 1 },
  { key: 'octa',  speed: 2.1, turn: 3.4,  scale: 0.58, from: 2 },
  { key: 'tetra', speed: 4.6, turn: 0.75, scale: 0.6,  from: 3 }
];
for (const T of TYPES) {
  const S = SHAPES[T.key], c = PAL[T.key];
  T.color = c;
  T.grp = new InstGroup([
    { mesh: solidMesh(S.V, S.F),    mat: makeMat({ c, emis: 0.16, diff: 0.5, gloss: 0.72, metal: 0.2 }) },
    { mesh: lineMesh(S.V, S.E, 1.02), mat: makeMat({ c, emis: 5.5, unlit: true }) }
  ], 256);
}
// debris groups: 0..3 enemy colours, 4 ion (white), 5 orb
const DEBRIS_COL = [PAL.cube, PAL.pyr, PAL.octa, PAL.tetra, PAL.ion, PAL.orb];
const debrisGrp = DEBRIS_COL.map(c => new InstGroup([{ mesh: shardMesh, mat: makeMat({ c, emis: 4.2, unlit: true, add: true, noCull: true }) }], 1024));
const trailGrp = new InstGroup([{ mesh: sphereMesh, mat: makeMat({ c: [0.35, 0.85, 1.0], emis: 0.7, unlit: true, add: true }) }], 64);

/* ---------------- world: ground grid, camera, post FX ---------------- */
const gc = document.createElement('canvas'); gc.width = gc.height = 256;
const g2 = gc.getContext('2d');
g2.fillStyle = '#000'; g2.fillRect(0, 0, 256, 256);
g2.strokeStyle = '#7a5cff'; g2.lineWidth = 4; g2.strokeRect(0, 0, 256, 256);
g2.fillStyle = '#d8ccff'; [[0,0],[256,0],[0,256],[256,256]].forEach(p => { g2.beginPath(); g2.arc(p[0], p[1], 7, 0, 7); g2.fill(); });
const gridTex = new pc.Texture(device, {
  width: 256, height: 256, format: pc.PIXELFORMAT_SRGBA8, mipmaps: true,
  addressU: pc.ADDRESS_REPEAT, addressV: pc.ADDRESS_REPEAT,
  minFilter: pc.FILTER_LINEAR_MIPMAP_LINEAR, magFilter: pc.FILTER_LINEAR, anisotropy: 8
});
gridTex.setSource(gc);
const GROUND = 150;
const groundMat = new pc.StandardMaterial();
groundMat.useSkybox = false;
groundMat.diffuse = new pc.Color(0.09, 0.08, 0.15);
groundMat.useMetalness = true; groundMat.metalness = 0.2; groundMat.gloss = 0.8;
groundMat.emissive = new pc.Color(0.5, 0.32, 1.0);
groundMat.emissiveMap = gridTex;
groundMat.emissiveMapTiling = new pc.Vec2(GROUND / 2.2, GROUND / 2.2);
groundMat.emissiveIntensity = 0.2;
groundMat.update();
const ground = new pc.Entity('ground');
ground.addComponent('render', { type: 'plane', material: groundMat, castShadows: false, receiveShadows: false });
ground.setLocalScale(GROUND, 1, GROUND);
app.root.addChild(ground);

const camE = new pc.Entity('camera');
camE.addComponent('camera', { clearColor: new pc.Color(0.012, 0.008, 0.032), nearClip: 0.5, farClip: 220, fov: 38 });
app.root.addChild(camE);

let cf = null, glowNote = 'CameraFrame bloom';
try {
  cf = new pc.CameraFrame(app, camE.camera);
  cf.rendering.samples = 4;                      // MSAA on the HDR target
  cf.rendering.toneMapping = pc.TONEMAP_ACES;
  cf.bloom.intensity = 0.055;
  cf.bloom.blurLevel = 14;
  cf.vignette.intensity = 0.5; cf.vignette.inner = 0.42; cf.vignette.outer = 1.15; cf.vignette.curvature = 0.6;
  cf.fringing.intensity = 8;                     // kept > 0 so pulsing never recompiles the shader
  cf.update();
} catch (e) { cf = null; glowNote = 'bloom unavailable'; console.warn(e); }

/* ---------------- camera math + arena (own pinhole model, matches engine) ---------------- */
const cam = { pitch: 58 * DEG, dist: 31, fovShort: 38 * DEG, px: 0, py: 0, pz: 0, fy: 0, fz: 0, uy: 0, uz: 0, tanH: 1, tanV: 1, w: 1, h: 1 };
const arena = { cx: 0, cz: 0, zMin: -8, zMax: 8, nearHalf: 8, farHalf: 10, spawnR: 30 };
const _g = [0, 0];
function rayGround(nx, ny, out) {
  const dx = nx * cam.tanH, dy = cam.fy + ny * cam.tanV * cam.uy, dz = cam.fz + ny * cam.tanV * cam.uz;
  const t = -cam.py / Math.min(dy, -1e-3);
  out[0] = cam.px + dx * t; out[1] = cam.pz + dz * t; return out;
}
const _scr = [0, 0];
function project(x, y, z) {
  const rx = x - cam.px, ry = y - cam.py, rz = z - cam.pz;
  const cz = ry * cam.fy + rz * cam.fz, cy = ry * cam.uy + rz * cam.uz;
  _scr[0] = (rx / (cz * cam.tanH) + 1) * 0.5 * cam.w;
  _scr[1] = (1 - cy / (cz * cam.tanV)) * 0.5 * cam.h;
  return _scr;
}
function layout() {
  const w = Math.max(1, window.innerWidth), hh = Math.max(1, window.innerHeight);
  cam.w = w; cam.h = hh;
  const aspect = w / hh, t = Math.tan(cam.fovShort / 2), c = camE.camera;
  if (aspect >= 1) { cam.tanV = t; cam.tanH = t * aspect; c.horizontalFov = false; }
  else { cam.tanH = t; cam.tanV = t / aspect; c.horizontalFov = true; }
  c.fov = cam.fovShort / DEG;
  const vHalf = Math.atan(cam.tanV);
  cam.pitch = Math.min(78 * DEG, Math.max(56 * DEG, vHalf + 26 * DEG));   // tall screens look down more
  const sp = Math.sin(cam.pitch), cp = Math.cos(cam.pitch);
  cam.fy = -sp; cam.fz = -cp; cam.uy = cp; cam.uz = -sp;
  cam.px = 0; cam.py = cam.dist * sp; cam.pz = cam.dist * cp;
  // playable trapezoid = what is visible, minus HUD margins
  const mx = 1 - 2 * 18 / w, top = 1 - 2 * 74 / hh, bot = -1 + 2 * 34 / hh;
  rayGround(mx, bot, _g); arena.nearHalf = Math.abs(_g[0]); arena.zMax = _g[1];
  rayGround(mx, top, _g); arena.farHalf = Math.abs(_g[0]); arena.zMin = _g[1];
  arena.cz = (arena.zMin + arena.zMax) / 2;

  combo = 0; comboT = 0; milestone = 0;

  for (const o of orbs) { o.on = false; o.e.enabled = o.r.enabled = false; }
}
function startGame() {
  clearWorld();
  state = 'play';
  score = 0; energy = 0; level = 0; playT = 0; spawnT = 1.6; slowT = 0; timeScale = 1; shake = 0;
  shownScore = -1; setScoreHud(); setEnergyHud(0); setComboHud(0);
  player.x = aim.x; player.z = aim.z; clampArena(player); player.alive = true;
  trailReset();
  for (const o of orbs) placeOrb(o);
  showPanel(null);
  elTag.style.display = 'none'; elPips.style.display = 'flex'; $('tl').style.display = 'block';
}
function die() {
  player.alive = false;
  state = 'over'; overAt = performance.now();
  addDebris(player.x, 0.5, player.z, 4, 70, 9);
  addDebris(player.x, 0.5, player.z, 1, 30, 6);
  flash(player.x, player.z, PAL.ion, 9, 14, 0.9);
  shake = 1; slowT = 0.6; fringe = 1;
  sfx.die();
  setScoreHud();
  const s = Math.floor(score);
  if (s > best) { best = s; saveBest(); }
  setBestHud();
  $('oScore').textContent = s.toLocaleString('en-US');
  $('oBest').textContent = 'Best ' + best.toLocaleString('en-US');
  setComboHud(0);
  showPanel(pOver);
}
function toTitle() {
  clearWorld();
  state = 'title'; player.alive = false;
  showPanel(pTitle); setBestHud();
  elTag.style.display = 'none'; elPips.style.display = 'none'; $('tl').style.display = 'none';
}

/* ---------------- stress test ---------------- */
let stress = null;
const fpsWin = [];                       // real frame timestamps, last 3 s
function startStress() {
  clearWorld();
  state = 'stress'; player.alive = true;
  player.x = 0; player.z = arena.cz;
  trailReset();
  stress = { t: 0, start: performance.now(), sim: 0, max: 0, spawnAcc: 0, boomAcc: 0, avg: 60 };
  fpsWin.length = 0; slowT = 0; timeScale = 1; sfx.boomGap = 0.09;
  showPanel(null);
  elTag.style.display = 'block'; elPips.style.display = 'none'; $('tl').style.display = 'none';
}
function updStress(dt, realDt) {
  const S = stress;
  S.t = (performance.now() - S.start) / 1000;   // test clock = wall time
  // auto-pilot so every run is comparable
  S.sim += dt;
  player.x = Math.sin(S.sim * 0.7) * arena.nearHalf * 0.45;
  player.z = arena.cz + Math.sin(S.sim * 0.53) * (arena.zMax - arena.zMin) * 0.25;
  S.spawnAcc += (80 + 70 * S.t) * dt;
  while (S.spawnAcc >= 1) {
    const n = Math.min(24, Math.floor(S.spawnAcc));
    spawnGroup((rand() * 4) | 0, n, 1, player.x, player.z); S.spawnAcc -= n;
  }
  S.boomAcc += enemies.length * 0.1 * dt;
  while (S.boomAcc >= 1 && enemies.length) {
    const e = enemies[(rand() * enemies.length) | 0]; kill(e, false); S.boomAcc -= 1;
  }
  const objs = enemies.length + D.n;
  if (objs > S.max) S.max = objs;
  elTag.innerHTML = `Stress test<br>${S.t.toFixed(1)} s, avg ${S.avg.toFixed(1)} FPS (3 s)`;
  if ((S.t > 3.5 && S.avg < 50) || objs > 400000) endStress();
}
function endStress() {
  const S = stress;
  state = 'stressdone'; sfx.boomGap = 0.03;
  $('sMax').textContent = S.max.toLocaleString('en-US');
  $('sInfo').textContent = `3-second average fell to ${S.avg.toFixed(1)} FPS after ${S.t.toFixed(1)} s`;
  clearWorld(); player.alive = false;
  elTag.style.display = 'none';
  showPanel(pStress);
}

/* ---------------- input (one finger / mouse) ---------------- */
let pointerDown = false;
function aimFrom(ev) {
  const touchy = ev.pointerType === 'touch' || ev.pointerType === 'pen';
  const off = touchy ? Math.min(84, Math.max(48, 0.085 * Math.min(cam.w, cam.h))) : 0;   // dot sits above the finger
  const nx = ev.clientX / cam.w * 2 - 1, ny = 1 - (ev.clientY - off) / cam.h * 2;
  rayGround(nx, ny, _g); aim.x = _g[0]; aim.z = _g[1];
  clampArena(aim);
}
window.addEventListener('pointerdown', (ev) => {
  if (ev.target === stressBtn) return;
  ev.preventDefault();
  sfx.init();
  pointerDown = true; aimFrom(ev);
  if (state === 'title') startGame();
  else if (state === 'over' && performance.now() - overAt > 300) startGame();
  else if (state === 'stressdone') toTitle();
}, { passive: false });
window.addEventListener('pointermove', (ev) => { if (pointerDown || ev.pointerType === 'mouse') aimFrom(ev); }, { passive: false });
window.addEventListener('pointerup', () => { pointerDown = false; });
window.addEventListener('pointercancel', () => { pointerDown = false; });
stressBtn.addEventListener('pointerdown', (ev) => { ev.preventDefault(); ev.stopPropagation(); sfx.init(); startStress(); });
stressBtn.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); sfx.init(); startStress(); } });
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
for (const ev of ['gesturestart', 'gesturechange', 'dblclick', 'contextmenu']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });

/* ---------------- main loop ---------------- */
let fpsFrames = 0, fpsT = 0, fpsShown = 0, lastNow = performance.now(), cfFringe = -1, attractT = 0;
app.on('update', (rawDt) => {
  const now = performance.now();
  const realDt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  const dt = Math.min(rawDt, 0.05);
  // fps counters
  fpsFrames++; fpsT += realDt;
  fpsWin.push(now); while (fpsWin.length > 2 && now - fpsWin[0] > 3000) fpsWin.shift();
  if (fpsWin.length > 2 && stress) stress.avg = (fpsWin.length - 1) * 1000 / (fpsWin[fpsWin.length - 1] - fpsWin[0]);
  if (fpsT >= 0.25) {
    fpsShown = fpsFrames / fpsT; fpsFrames = 0; fpsT = 0;
    elFps.textContent = fpsShown.toFixed(0);
    elObj.textContent = (enemies.length + D.n).toLocaleString('en-US');
    elDc.textContent = app.stats && app.stats.drawCalls ? app.stats.drawCalls.total : '-';
  }
  // slow motion
  if (slowT > 0) { slowT -= dt; timeScale = 0.22; }
  else timeScale += (1 - timeScale) * Math.min(1, dt * 5);
  const gdt = state === 'stress' ? dt : dt * timeScale;
  clock += gdt;
  bigCd -= dt;

  // targets per state
  let tx = player.x, tz = player.z, canHit = false;
  if (state === 'play') {
    playT += gdt; score += 10 * gdt;
    const lv = Math.floor(playT / 15);
    if (lv > level) { level = lv; gridPulse = 1; sfx.level(); }
    const sm = Math.min(2.3, 1 + 0.11 * level);
    spawnT -= gdt;
    if (spawnT <= 0 && enemies.length < 280) {
      const avail = TYPES.filter(T => T.from <= level);
      spawnGroup(TYPES.indexOf(avail[(rand() * avail.length) | 0]), Math.min(26, 4 + 2 * level + ((rand() * 3) | 0)), sm, player.x, player.z);
      spawnT = Math.max(0.5, 2.6 * Math.pow(0.86, level)) * (0.8 + rand() * 0.4);
    }
    canHit = true;
  } else if (state === 'over') {
    tx = player.x + Math.sin(clock * 0.8) * 3; tz = player.z + Math.cos(clock * 0.6) * 3;
  } else if (state === 'title') {
    attractT += gdt;
    tx = Math.sin(clock * 0.45) * arena.nearHalf * 0.55; tz = arena.cz + Math.cos(clock * 0.31) * (arena.zMax - arena.zMin) * 0.28;
    if (enemies.length < 40 && rand() < 0.03) spawnGroup((rand() * 4) | 0, 8, 0.8, tx, tz);
    if (attractT > 5.5 && enemies.length > 20) {            // demo chain reaction
      attractT = 0;
      let bestE = null, bd = Infinity;
      for (const e of enemies) { const d = (e.x - tx) ** 2 + (e.z - tz) ** 2; if (d < bd) { bd = d; bestE = e; } }
      if (bestE) kill(bestE, true);
    }
  } else if (state === 'stress') {
    updStress(dt, realDt); if (state !== 'stress') return;
    tx = player.x; tz = player.z; canHit = false;
  }

  // player
  if (player.alive) {
    if (state === 'play') {
      const k = 1 - Math.exp(-15 * gdt);
      player.x += (aim.x - player.x) * k; player.z += (aim.z - player.z) * k;
      clampArena(player);
    }
    const last = trail[trailHead], ddx = player.x - last.x, ddz = player.z - last.z;
    const steps = Math.min(12, Math.max(1, Math.ceil(Math.hypot(ddx, ddz) / TRAIL_STEP)));
    const lx = last.x, lz = last.z;
    for (let s = 1; s <= steps; s++) trailAdd(lx + ddx * s / steps, lz + ddz * s / steps);
  }

  gridBuild();
  updEnemies(gdt, tx, tz, canHit && player.alive);
  if (state === 'play' || state === 'over' || state === 'title') { updWave(gdt); processBlasts(gdt); }
  else processBlasts(gdt);

  // combo window
  if (combo > 0) { comboT -= gdt; if (comboT <= 0) { combo = 0; milestone = 0; } }
  setComboHud(state === 'play' ? combo : 0);

  // orbs
  for (const o of orbs) {
    if (!o.on) {
      if (state === 'play' && (o.wait -= gdt) <= 0) placeOrb(o);
      continue;
    }
    o.ph += gdt * 3;
    const y = 0.55 + Math.sin(o.ph) * 0.12, s = 0.34 + Math.sin(o.ph * 2) * 0.04;
    o.e.setPosition(o.x, y, o.z); o.e.setLocalScale(s, s, s);
    o.r.setPosition(o.x, 0.08, o.z); o.r.setLocalScale(0.55, 0.6, 0.55);
    if (state === 'play' && player.alive && (o.x - player.x) ** 2 + (o.z - player.z) ** 2 < 0.85 * 0.85) {
      o.on = false; o.e.enabled = o.r.enabled = false; o.wait = 0.35;
      energy++;
      addDebris(o.x, 0.5, o.z, 5, 10, 4);
      flash(o.x, o.z, PAL.orb, 2.5, 5, 0.3);
      sfx.pickup(energy);
      if (energy >= 10) { energy = 0; triggerWave(); }
      setEnergyHud(energy);
    }
  }

  compactEnemies();
  updDebris(gdt);
  updLights(gdt);

  // draw instanced groups
  drawEnemies();
  if (player.alive) {
    for (let i = 1; i < TRAIL_N; i++) {
      const p = trail[(trailHead - i + TRAIL_N) % TRAIL_N], k = 1 - (clock - p.t) / TRAIL_LIFE;
      if (k <= 0) break;
      trailGrp.push(p.x, 0.45, p.z, 0.5 * k * k + 0.05, 0, 0);
    }
  }
  for (const T of TYPES) T.grp.flush();
  for (const g of debrisGrp) g.flush();
  trailGrp.flush();

  // player visuals
  playerE.enabled = chargeE.enabled = pLight.enabled = player.alive;
  if (player.alive) {
    playerE.setPosition(player.x, 0.45, player.z);
    pLight.setPosition(player.x, 1.2, player.z);
    const pulse = energy >= 9 ? 0.5 + 0.5 * Math.sin(clock * 18) : 0;
    chargeE.setPosition(player.x, 0.1, player.z);
    const cs = 0.8 + energy * 0.03; chargeE.setLocalScale(cs, 1, cs);
    chargeMat.emissiveIntensity = state === 'play' ? 0.25 + energy * 0.32 + pulse * 2 : 0.2; chargeMat.update();
  }

  // grid pulse on level-up
  if (gridPulse > 0) { gridPulse = Math.max(0, gridPulse - dt * 1.4); groundMat.emissiveIntensity = 0.2 + gridPulse * 1.0; groundMat.update(); }

  // camera: shake + fringing
  shake = Math.max(0, shake - dt * 2.6);
  const amp = shake * shake * (reduceMotion ? 0.15 : 0.55);
  camE.setPosition(cam.px + (rand() - 0.5) * amp, cam.py + (rand() - 0.5) * amp * 0.5, cam.pz + (rand() - 0.5) * amp);
  camE.setEulerAngles(-cam.pitch / DEG, 0, 0);
  if (cf) {
    fringe = Math.max(0, fringe - dt * 2);
    const fr = Math.round(8 + fringe * 60);
    if (fr !== cfFringe) { cfFringe = fr; cf.fringing.intensity = fr; cf.update(); }
  }
  if (state === 'play') setScoreHud();
});

/* ---------------- boot ---------------- */
onResize();
setBestHud();
toTitle();
app.start();
window.__neon = { app, enemies, D, orbs, project, get player() { return player; }, get energy() { return energy; }, get state() { return state; }, get stress() { return stress; }, startGame, startStress, triggerWave, glowNote };
})();
</script>
